<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gaussian Splat</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; color: #fff; font: 14px/1 monospace;
    }
    #loading-track {
      width: 280px; height: 3px; background: #333; border-radius: 2px; overflow: hidden;
    }
    #loading-bar {
      height: 100%; width: 0%; background: #fff; border-radius: 2px;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="loading">
    <div id="loading-track"><div id="loading-bar"></div></div>
    <div id="loading-label">loading…</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
